<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7ooooda's Birthday Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf3;--card:#ffffff;--ink:#4a2c17;--accent:#c2571a;--gold:#e09f3e;--rust:#9e2a2b;--soft:#f6e3cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a10;--card:#3a2415;--ink:#fbeedd;--soft:#5a3820}}
:root[data-theme="dark"]{--bg:#2a1a10;--card:#3a2415;--ink:#fbeedd;--soft:#5a3820}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',Georgia,sans-serif;text-align:center;overflow-x:hidden;
background-image:radial-gradient(circle at 15% 10%,rgba(224,159,62,.25),transparent 40%),radial-gradient(circle at 90% 80%,rgba(194,87,26,.2),transparent 45%)}
.leaf{position:fixed;top:-40px;font-size:28px;animation:fall linear infinite;opacity:.85;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
main{position:relative;max-width:640px;margin:0 auto;padding:40px 20px 60px}
.invited{letter-spacing:.35em;text-transform:uppercase;color:var(--accent);font-weight:700;font-size:1rem}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(3rem,15vw,6rem);line-height:1;margin:.3em 0;
background:linear-gradient(135deg,var(--rust),var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.date{display:inline-block;background:var(--card);border:2px dashed var(--gold);border-radius:18px;padding:14px 26px;font-size:1.2rem;font-weight:700;margin:10px 0 24px;box-shadow:0 6px 20px rgba(158,42,43,.12)}
.photo{display:block;width:min(78%,300px);aspect-ratio:1/1;object-fit:cover;object-position:center 30%;margin:18px auto;border-radius:50%;border:6px solid var(--card);box-shadow:0 0 0 4px var(--gold),0 10px 28px rgba(158,42,43,.25)}
.card{background:var(--card);border-radius:22px;padding:24px;margin:20px 0;box-shadow:0 8px 28px rgba(158,42,43,.12);border-top:5px solid var(--accent)}
.card h2{font-family:'Playfair Display',Georgia,serif;margin:0 0 14px;color:var(--rust)}
:root[data-theme="dark"] .card h2{color:var(--gold)}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--soft);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{padding:14px;border-radius:12px;border:2px solid var(--soft);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.opt.sel{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.03)}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--accent),var(--rust));color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
.btn.alt{background:linear-gradient(135deg,var(--gold),var(--accent))}
#msg{margin-top:14px;font-weight:700;color:var(--accent);min-height:1.4em}
</style>
</head>

  function mark(){opts.forEach(function(o){o.classList.toggle('sel',o.dataset.v===vote);});}
